<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whoami</title>
    <!-- Favicon -->
    <link rel="icon" data-profile-image-link type="image/jpeg" />
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <!-- Core theme CSS -->
    <link rel="stylesheet" href="/style.css">
    <script src="/vendor/sortable.min.js" defer></script>
    <script src="/links.js" type="module"></script>
  </head>
  <body>
    <button id="profilePicture" type="button" aria-label="Profile picture" aria-pressed="false">
      <img data-profile-image alt="Profile Picture" hidden>
    </button>

    <div class="overlay" id="popup">
      <div class="popup">
        <div class="popup-photo">
          <a data-profile-image-link target="_blank" rel="noopener noreferrer">
            <img data-profile-image alt="Profile Picture" hidden>
          </a>
        </div>
        <a class="popup-close" onclick="history.back()">&times;</a>
      </div>
    </div>

    <div id="userName"></div>

    <div id="saveStatus" role="status" hidden>
      <span id="saveMessage">Saved</span>
      <button id="retrySave" type="button" title="Retry saving" aria-label="Retry saving" hidden>
        <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
      </button>
      <button id="logout" type="button" title="Sign out" aria-label="Sign out" hidden>
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
      </button>
    </div>

    <button id="addLink" type="button" hidden>
      <i class="fa-solid fa-plus" aria-hidden="true"></i>
      Add link
    </button>

    <div id="links" aria-live="polite">
    </div>

    <dialog id="authDialog" aria-labelledby="authDialogTitle">
      <form id="authForm">
        <header class="dialog-header">
          <h1 id="authDialogTitle">Sign in</h1>
          <button id="closeAuthDialog" class="icon-button" type="button" aria-label="Close sign in" title="Close">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </header>
        <label for="adminUsername">Username</label>
        <input id="adminUsername" name="username" autocomplete="username" maxlength="256" required autofocus>
        <label for="adminPassword">Password</label>
        <input id="adminPassword" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
        <p id="authError" role="alert"></p>
        <footer class="dialog-actions">
          <button id="cancelAuthDialog" type="button">Cancel</button>
          <button class="primary-action" type="submit">Sign in</button>
        </footer>
      </form>
    </dialog>

    <dialog id="linkDialog" aria-labelledby="linkDialogTitle">
      <form id="linkForm">
        <header class="dialog-header">
          <h1 id="linkDialogTitle">New link</h1>
          <button id="closeLinkDialog" class="icon-button" type="button" aria-label="Close" title="Close">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </header>
        <label for="linkTitle">Title</label>
        <input id="linkTitle" name="title" maxlength="120" required autocomplete="off" autofocus>
        <label for="linkUrl">URL</label>
        <input id="linkUrl" name="url" type="url" maxlength="2048" placeholder="https://" required autocomplete="url">
        <fieldset>
          <legend>Icon</legend>
          <label class="sr-only" for="iconSearch">Search icons</label>
          <input id="iconSearch" type="search" placeholder="Search icons" autocomplete="off">
          <div id="iconOptions"></div>
          <p id="noIcons" role="status" hidden>No matching icons.</p>
        </fieldset>
        <footer class="dialog-actions">
          <button id="cancelLinkDialog" type="button">Cancel</button>
          <button class="primary-action" type="submit">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
            Add link
          </button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
